      - Functions: guide/functions.md
      - Lists: guide/lists.md
      - Maps: guide/maps.md
      - Records: guide/records.md
      - Enums and Match: guide/enums-and-match.md
      - Optional and Result: guide/optional-and-result.md
      - Newtypes: guide/newtypes.md
      - Modules: guide/modules.md
  - Language Reference:
      - Lexical Structure: language/lexical-structure.md
      - Primitive Types: language/primitive-types.md
      - Functions: language/functions.md
      - Lists: language/lists.md
      - Records: language/records.md
      - Enums and Match: language/enums-and-match.md
      - Optional and Result: language/optional-and-result.md
